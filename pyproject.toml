[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwork"
version = "1.0.0"
description = "Swap RIVALS assets (textures, sounds, meshes) on your own PC."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.1,<13",
    "pywebview>=5.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
patchwork = "patchwork.app:main"

[tool.setuptools.packages.find]
include = ["patchwork*"]

[tool.setuptools.package-data]
patchwork = ["webui/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
