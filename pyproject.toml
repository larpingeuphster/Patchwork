[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwork"
version = "2.0.1"
description = "Swap RIVALS assets (images, sounds, skins) in Roblox's cache on your own PC."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "xxhash>=3.4",
    "zstandard>=0.22",
    "pillow>=10",
    "pywebview>=5.3; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
patchwork = "patchwork.app:main"

[tool.setuptools.packages.find]
include = ["patchwork*"]

[tool.setuptools.package-data]
patchwork = ["webui/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
