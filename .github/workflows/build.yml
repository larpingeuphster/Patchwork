name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Patchwork.exe
        run: pyinstaller packaging/patchwork.spec --noconfirm
      - name: Self-check the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process dist\Patchwork.exe -ArgumentList '--self-check', "$PWD\selfcheck.txt" -Wait -PassThru
          Get-Content selfcheck.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Patchwork-windows
          path: dist/Patchwork.exe

  # Publishes a GitHub Release with Patchwork.exe when main has a version that
  # hasn't been released yet (the version comes from patchwork/__init__.py).
  # Notes come from release-notes/v<version>.md; editing that file on main
  # updates an existing release's notes without re-uploading the .exe.
  # Pushing a v* tag by hand also publishes that release.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('patchwork/__init__.py').read()).group(1))")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          notes="release-notes/v$version.md"
          if [ -f "$notes" ]; then echo "notes=$notes" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update notes on the existing release
        if: steps.version.outputs.exists == 'true' && steps.version.outputs.notes != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --notes-file "${{ steps.version.outputs.notes }}"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: Patchwork-windows
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Patchwork ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Patchwork.exe
          body_path: ${{ steps.version.outputs.notes }}
          generate_release_notes: ${{ steps.version.outputs.notes == '' }}
